global:
  scrape_interval: 5s
scrape_configs:
  - job_name: collector-metrics
    honor_labels: true
    static_configs:
      - targets: ['collector:8889']
  - job_name: jmeter-targets
    honor_labels: true
    file_sd_configs:
      - files: ['/etc/prometheus/targets/*.json']
        refresh_interval: 5s
