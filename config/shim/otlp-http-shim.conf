# Boomi API Gateway bug workaround: it posts OTLP/HTTP with "Content-Type: application/x-protobuf"
# but a JSON body, so the collector answers 400 "proto: unexpected end of group".
# This proxy looks at the body: if it starts with "{" it is JSON, so the content type is rewritten.
# Anything else (real protobuf) is forwarded untouched. Remove it once the gateway is fixed.
map $request_body $otlp_content_type {
    default      $http_content_type;
    ~^\s*\{      "application/json";
}

server {
    listen 4318;
    listen 4320;
    client_max_body_size 16m;
    client_body_buffer_size 16m;   # $request_body is only readable when the body is held in memory

    location / {
        proxy_pass http://collector:4318;
        proxy_http_version 1.1;
        proxy_set_header Content-Type $otlp_content_type;
        proxy_set_header Host $host;
    }
}
