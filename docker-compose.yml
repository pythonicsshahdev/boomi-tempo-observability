name: boomi-tempo

services:
  collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./config:/etc/otelcol:ro
    ports:
      - "4317:4317"
      - "4319:4317"
    mem_limit: 256m
    restart: always
    depends_on: [tempo]

  # Publishes the OTLP/HTTP ports (4318, 4320) and repairs the Boomi API Gateway's JSON-as-protobuf
  # requests before they reach the collector. See config/shim/otlp-http-shim.conf.
  otlp-http-shim:
    image: nginx:1.27-alpine
    volumes:
      - ./config/shim:/etc/nginx/conf.d:ro
    ports:
      - "4318:4318"
      - "4320:4320"
    mem_limit: 64m
    restart: always
    depends_on: [collector]

  tempo:
    image: grafana/tempo:2.9.0
    user: root
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./config:/etc/tempo:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    mem_limit: 1g
    restart: always

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus-config/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./config:/etc/prometheus-config:ro
      - ./targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    mem_limit: 256m
    restart: always

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/plugins:/var/lib/grafana/plugins:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    mem_limit: 512m
    restart: always
    depends_on: [tempo, prometheus]

volumes:
  tempo-data:
  prometheus-data:
  grafana-data:
